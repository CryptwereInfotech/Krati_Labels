<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Consumables</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>
    <div id="header"></div>

<main class="main py-5">
    <div class="container">

        <!-- Section Title -->
        <!-- <div class="section-title text-center mb-5" data-aos="fade-up">
            <h2>Consumables</h2>
        </div> -->

        <!-- Hero Banner with Background Image -->
        <section class="product-banner d-flex align-items-center justify-content-center">
            <h1 class="text-white fw-bold text-center shadow-text">Consumables</h1>
        </section>

        <!-- Product Sections -->
        <div class="product-category mb-5">
<h3 class="fw-bold mb-4" style="color: #28446f;">Labels</h3>
            <div class="row g-4">
                <div class="col-lg-3 col-md-4 col-sm-6" data-aos="zoom-in">
                    <div class="product-card p-3 text-center border rounded-4 shadow-sm h-100">
                        <img src="assets/img/products/Consumables/Labels/paper-label.jpg" class="img-fluid rounded"
                            alt="paper-label">
                        <p class="mt-3 fw-semibold">Paper Label</p>
                    </div>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6" data-aos="zoom-in">
                    <div class="product-card p-3 text-center border rounded-4 shadow-sm h-100">
                        <img src="assets/img/products/Consumables/Labels/polyester-label.jpg" class="img-fluid rounded"
                            alt="polyester-label">
                        <p class="mt-3 fw-semibold">Polyester Label</p>
                    </div>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6" data-aos="zoom-in">
                    <div class="product-card p-3 text-center border rounded-4 shadow-sm h-100">
                        <img src="assets/img/products/Consumables/Labels/speciality-label.jpg" class="img-fluid rounded"
                            alt="speciality-label">
                        <p class="mt-3 fw-semibold">Speciality Label</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="product-category mb-5">
            <h3 class="fw-bold mb-4" style="color: #28446f;">Direct Thermal Rolls</h3>

            <div class="row g-4">
                <div class="col-lg-3 col-md-4 col-sm-6" data-aos="zoom-in">
                    <div class="product-card p-3 text-center border rounded-4 shadow-sm h-100">
                        <img src="assets/img/products/Consumables/Direct Thermal Rolls/biiling1.jpg"
                            class="img-fluid rounded" alt="billing roll">
                        <p class="mt-3 fw-semibold">Billing Roll</p>
                    </div>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6" data-aos="zoom-in">
                    <div class="product-card p-3 text-center border rounded-4 shadow-sm h-100">
                        <img src="assets/img/products/Consumables/Direct Thermal Rolls/toll1.png"
                            class="img-fluid rounded" alt="toll roll">
                        <p class="mt-3 fw-semibold">Toll Roll</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="product-category mb-5">
                        <h3 class="fw-bold mb-4" style="color: #28446f;">Tags</h3>

            <div class="row g-4">
                <div class="col-lg-3 col-md-4 col-sm-6" data-aos="zoom-in">
                    <div class="product-card p-3 text-center border rounded-4 shadow-sm h-100">
                        <img src="assets/img/products/Consumables/TAGS/polyester-tags1.png" class="img-fluid rounded"
                            alt="polyester-tags1">
                        <p class="mt-3 fw-semibold">Polyester Tag</p>
                    </div>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6" data-aos="zoom-in">
                    <div class="product-card p-3 text-center border rounded-4 shadow-sm h-100">
                        <img src="assets/img/products/Consumables/TAGS/paper-tag1.jpg" class="img-fluid rounded"
                            alt="paper-tag1">
                        <p class="mt-3 fw-semibold">Paper Tag</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="product-category mb-5">
             <h3 class="fw-bold mb-4" style="color: #28446f;">Thermal Transfer Ribbon</h3>

            <div class="row g-4">
                <div class="col-lg-3 col-md-4 col-sm-6" data-aos="zoom-in">
                    <div class="product-card p-3 text-center border rounded-4 shadow-sm h-100">
                        <img src="assets/img/products/Consumables/Thermal Transfer Ribbon/wax.jpg"
                            class="img-fluid rounded" alt="wax ribbon">
                        <p class="mt-3 fw-semibold">Wax Ribbon</p>
                    </div>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6" data-aos="zoom-in">
                    <div class="product-card p-3 text-center border rounded-4 shadow-sm h-100">
                        <img src="assets/img/products/Consumables/Thermal Transfer Ribbon/wax-resin.jpg"
                            class="img-fluid rounded" alt="wax-resin ribbon">
                        <p class="mt-3 fw-semibold">Wax-Resin Ribbon</p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<style>

    .product-card {
  background-color: #fff;
  border: 2px solid transparent;
  transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}

.product-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
  border-color: #28446f;
}
.product-card p {
  transition: color 0.3s ease;
}

.product-card:hover p {
  color: #28446f;
}
    </style>

    <style>
        .product-banner {
            height: 60vh;
            background: url('assets/img/Background/Consumables.back.jpg') no-repeat center center/cover;
            position: relative;
        }
    
        .shadow-text {
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            font-size: 3rem;
        }
    </style>

    <script>
        fetch("header.html")
            .then(res => res.text())
            .then(data => document.getElementById("header").innerHTML = data);

        fetch("footer.html")
            .then(res => res.text())
            .then(data => document.getElementById("footer").innerHTML = data);
    </script>
<!-- Bootstrap Bundle with Popper -->
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <div id="footer" class="footer"></div>
</body>

</html>
